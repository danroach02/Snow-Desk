name: Resort snow reports
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/**', '.github/workflows/reports.yml']
permissions:
  contents: write
concurrency: reports
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-reports.mjs
      - name: Save
        run: |
          git config user.name "snow-desk-bot"
          git config user.email "snow-desk-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update resort snow reports"
          git pull --rebase -q && git push -q
